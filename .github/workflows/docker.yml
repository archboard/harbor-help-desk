name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  docker:
    name: Docker (${{ matrix.arch }})
    # Each arch builds natively on its own runner instead of under QEMU
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: harbor
          POSTGRES_USER: harbor
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harbor -d harbor"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # /up checks Redis as well as Postgres
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          push: false
          load: true
          tags: harbor-help:ci
          build-args: HARBOR_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Boot the image
        run: |
          docker run -d --name app --network host \
            -e APP_KEY=base64:$(openssl rand -base64 32) \
            -e DB_CONNECTION=pgsql -e DB_HOST=127.0.0.1 -e DB_DATABASE=harbor -e DB_USERNAME=harbor -e DB_PASSWORD=secret \
            -e HARBOR_MULTITENANT=false -e REDIS_HOST=127.0.0.1 \
            -e CACHE_STORE=array -e SESSION_DRIVER=array -e QUEUE_CONNECTION=sync -e BROADCAST_CONNECTION=log \
            harbor-help:ci sh -c "php artisan migrate --force && frankenphp php-server --root public --listen :8000"
          for i in $(seq 1 30); do curl -f http://localhost:8000/up && exit 0; sleep 2; done
          docker logs app
          exit 1

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image labels
        if: github.event_name == 'push'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/harbor-help

      # Pushed untagged; the manifest job tags the combined multi-arch image
      - name: Push image by digest
        if: github.event_name == 'push'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          platforms: linux/${{ matrix.arch }}
          build-args: HARBOR_VERSION=${{ steps.version.outputs.value }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/harbor-help,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Save digest
        if: github.event_name == 'push'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.push.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  manifest:
    name: Docker manifest
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/harbor-help
          tags: |
            type=sha
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ github.repository_owner }}/harbor-help@sha256:%s ' *)
